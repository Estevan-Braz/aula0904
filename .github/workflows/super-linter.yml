name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (se necessário para build)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lint Code Base
        uses: github/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "master"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # ☕ Java Configuration
          VALIDATE_JAVA: true
          JAVA_FILE_NAME: checkstyle.xml
          
          # 📝 Documentation
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          
          # 🎯 Performance & Output
          LOG_LEVEL: WARN
          SUPPRESS_POSSUM: true
          CREATE_LOG_FILE: true
